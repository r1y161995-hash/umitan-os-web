
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UMITAN NEWS LAB05.2</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,
    "Hiragino Sans",sans-serif;
  background:#0b263d;
  color:#fff;
}

/* WEATHERと同様のホーム表示領域を想定 */
#os-frame{
  position:relative;
  width:100%;
  max-width:480px;
  height:100dvh;
  margin:0 auto;
  overflow:hidden;
  background:#143d61;
}

/* 第1層：背景とキャスターの一体型画像 */
#news-background{
  position:absolute;
  inset:0;
  background-image:url("./news_bg.png");
  background-repeat:no-repeat;
  background-size:contain;
  background-position:center top;
  background-color:#143d61;
}

/* 背景の余白を自然に埋める */
#news-background::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  background:linear-gradient(
    180deg,#1d6497,#113c63 65%,#082a48
  );
}

/* 第2層：ニュースウィンドウ */
#news-window{
  --news-height:66%;
  position:absolute;
  left:10px;
  right:10px;
  bottom:10px;
  height:var(--news-height);
  max-height:var(--news-height);
  min-height:0;
  z-index:5;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  border:1px solid rgba(151,220,242,.65);
  border-radius:18px;
  background:rgba(8,39,67,.94);
  box-shadow:0 10px 30px rgba(0,17,37,.4);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  transition:height .18s ease-out,
             max-height .18s ease-out;
}

#news-window.moving{
  transition:none;
}

/* WEATHER LAB10型ドラッグヘッダー */
#drag-head{
  position:relative;
  flex-shrink:0;
  padding:12px 13px 11px;
  text-align:center;
  cursor:grab;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  border-bottom:1px solid rgba(255,255,255,.16);
}

#drag-head.armed{
  cursor:grabbing;
}

#grip{
  display:block;
  width:56px;
  height:5px;
  margin:0 auto 11px;
  border-radius:99px;
  background:rgba(181,232,243,.8);
  box-shadow:0 0 6px rgba(103,197,210,.3);
}

#drag-head.armed #grip{
  background:#f3ffff;
  box-shadow:0 0 10px #b5f3ff;
}

#panel-title{
  font-size:15px;
  font-weight:700;
  line-height:1.5;
  color:#f2fbff;
}

/* 更新状況 */
#news-status{
  flex-shrink:0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  padding:9px 13px;
  border-bottom:1px solid rgba(255,255,255,.12);
  color:#badbe7;
  font-size:11px;
  line-height:1.5;
}

#updated-at{
  min-width:0;
  overflow-wrap:anywhere;
}

#refresh{
  flex-shrink:0;
  padding:6px 11px;
  border:1px solid #7ad8eb;
  border-radius:12px;
  background:#164a65;
  color:#fff;
  font-size:11px;
  cursor:pointer;
}

#refresh:disabled{
  opacity:.5;
}

/* ニュース一覧のみスクロール */
#news-list{
  flex:1;
  min-height:0;
  overflow-y:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  padding:12px;
}

.news-card{
  display:block;
  margin-bottom:10px;
  padding:12px 13px;
  border:1px solid rgba(140,203,230,.24);
  border-radius:14px;
  background:rgba(255,255,255,.055);
  color:#fff;
  text-decoration:none;
}

.news-card:active{
  background:rgba(255,255,255,.16);
}

.news-number{
  margin-bottom:6px;
  font-size:10px;
  font-weight:700;
  letter-spacing:.07em;
  color:#8ce3ed;
}

.news-title{
  font-size:13px;
  font-weight:600;
  line-height:1.65;
  overflow-wrap:anywhere;
}

.news-meta{
  margin-top:9px;
  font-size:10px;
  line-height:1.5;
  color:#b6d4e2;
}

#message{
  padding:25px 12px;
  text-align:center;
  font-size:13px;
  line-height:1.8;
  white-space:pre-line;
  color:#d5e9ef;
}

#footer{
  flex-shrink:0;
  padding:8px 12px;
  text-align:center;
  border-top:1px solid rgba(255,255,255,.12);
  color:#a8cad8;
  font-size:10px;
}

/* 横画面や小さい画面にも対応 */
@media(max-height:650px){
  #drag-head{
    padding:8px 10px;
  }
  #grip{
    margin-bottom:6px;
  }
  #news-list{
    padding:8px;
  }
}

@media(prefers-reduced-motion:reduce){
  #news-window{
    transition:none;
  }
}
</style>
</head>

<body>
<main id="os-frame">

  <div id="news-background"
       aria-label="ニューススタジオのうみたん">
  </div>

  <section id="news-window"
           aria-label="UMITAN NEWS">

    <div id="drag-head"
         aria-label="長押しして高さを変更。ダブルタップで元に戻す">
      <span id="grip"></span>
      <div id="panel-title">
        📰 うみたんのニュースだより
      </div>
    </div>

    <div id="news-status">
      <span id="updated-at">読み込み中...</span>
      <button id="refresh" type="button">
        更新 ↻
      </button>
    </div>

    <div id="news-list">
      <div id="message">
        めいめい、ニュースを確認しているよ！💙
      </div>
    </div>

    <div id="footer">
      UMITAN NEWS · LAB05.2
    </div>

  </section>
</main>

<script>
"use strict";

const frame=document.getElementById("os-frame");
const win=document.getElementById("news-window");
const grip=document.getElementById("drag-head");
const list=document.getElementById("news-list");
const updated=document.getElementById("updated-at");
const refresh=document.getElementById("refresh");

/* WEATHER LAB09/10を参考にした高さ制御 */
const DEFAULT=66;
const MIN=18;
const MAX=79;

let percent=DEFAULT;
let tracking=null;
let holdTimer=null;
let lastTap=0;

function clamp(value){
  return Math.min(MAX,Math.max(MIN,value));
}

function setHeight(value){
  percent=clamp(value);
  win.style.setProperty(
    "--news-height",
    percent.toFixed(2)+"%"
  );
}

function clearHold(){
  if(holdTimer!==null){
    clearTimeout(holdTimer);
    holdTimer=null;
  }
}

function stopDrag(){
  clearHold();
  tracking=null;
  win.classList.remove("moving");
  grip.classList.remove("armed");
}

grip.addEventListener("pointerdown",event=>{
  if(event.pointerType==="mouse"&&event.button!==0){
    return;
  }

  stopDrag();

  tracking={
    id:event.pointerId,
    startY:event.clientY,
    startPercent:percent,
    armed:false
  };

  try{
    grip.setPointerCapture(event.pointerId);
  }catch(error){}

  /* 長押し後にドラッグ可能 */
  holdTimer=setTimeout(()=>{
    holdTimer=null;

    if(!tracking)return;

    tracking.armed=true;
    win.classList.add("moving");
    grip.classList.add("armed");
  },260);
});

grip.addEventListener("pointermove",event=>{
  if(!tracking||
     event.pointerId!==tracking.id){
    return;
  }

  const delta=event.clientY-tracking.startY;

  /* 長押し前の大きな移動はキャンセル */
  if(!tracking.armed){
    if(Math.abs(delta)>12){
      stopDrag();
    }
    return;
  }

  const frameHeight=frame.getBoundingClientRect().height;
  if(frameHeight<=0)return;

  const deltaPercent=delta/frameHeight*100;

  /* 下端固定なので、上に動かすと高さが増す */
  setHeight(tracking.startPercent-deltaPercent);
});

grip.addEventListener("pointerup",event=>{
  if(!tracking||
     event.pointerId!==tracking.id){
    return;
  }

  const wasArmed=tracking.armed;
  stopDrag();

  if(!wasArmed){
    const now=Date.now();

    if(now-lastTap<350){
      setHeight(DEFAULT);
      lastTap=0;
    }else{
      lastTap=now;
    }
  }
});

grip.addEventListener("pointercancel",stopDrag);
grip.addEventListener("lostpointercapture",()=>{
  if(tracking)stopDrag();
});

grip.addEventListener("dblclick",()=>{
  setHeight(DEFAULT);
});

/* 日付表示 */
function formatDate(value){
  if(!value)return "日時不明";

  const d=new Date(value);

  if(Number.isNaN(d.getTime())){
    return String(value);
  }

  return new Intl.DateTimeFormat("ja-JP",{
    timeZone:"Asia/Tokyo",
    month:"numeric",
    day:"numeric",
    hour:"2-digit",
    minute:"2-digit"
  }).format(d);
}

/* 記事リンクの検証 */
function safeUrl(value){
  try{
    const url=new URL(value);

    if(url.protocol==="https:"||
       url.protocol==="http:"){
      return url.href;
    }
  }catch(error){}

  return null;
}

/* 読み込み状態表示 */
function showMessage(text){
  list.replaceChildren();

  const message=document.createElement("div");
  message.id="message";
  message.textContent=text;
  list.appendChild(message);
}

/* ニュースカード */
function makeCard(item,index){
  const url=safeUrl(item.link);
  const card=document.createElement(url?"a":"div");

  card.className="news-card";

  if(url){
    card.href=url;
    card.target="_blank";
    card.rel="noopener noreferrer";
  }

  const number=document.createElement("div");
  number.className="news-number";
  number.textContent=
    "NEWS "+String(index+1).padStart(2,"0");

  const title=document.createElement("div");
  title.className="news-title";
  title.textContent=item.title||"タイトルなし";

  const meta=document.createElement("div");
  meta.className="news-meta";
  meta.textContent=
    (item.source||"情報源不明")+
    " · "+formatDate(item.date)+
    (url?" ↗":"");

  card.append(number,title,meta);
  return card;
}

/* GitHub Actions生成JSONからニュース取得 */
async function loadNews(){
  refresh.disabled=true;
  updated.textContent="ニュースを確認中...";
  showMessage("🌊 ニュースを読み込んでいるよ...");

  try{
    const response=await fetch(
      "./news.json?t="+Date.now(),
      {cache:"no-store"}
    );

    if(!response.ok){
      throw new Error("HTTP "+response.status);
    }

    const data=await response.json();
    const items=data.topics?.["海上保安庁"];

    if(!Array.isArray(items)){
      throw new Error(
        "海上保安庁のニュースデータがありません"
      );
    }

    const news=items.slice(0,10);
    const fragment=document.createDocumentFragment();

    news.forEach((item,index)=>{
      fragment.appendChild(makeCard(item,index));
    });

    list.replaceChildren(fragment);

    if(news.length===0){
      showMessage(
        "現在、表示できるニュースはないみたい。"
      );
    }

    updated.textContent=
      news.length+"件 · 更新 "+
      formatDate(data.updated_at);

    list.scrollTop=0;

  }catch(error){
    updated.textContent="読み込みエラー";

    showMessage(
      "めいめい、ごめんね。\n"+
      "ニュースを取得できなかったよ。\n"+
      error.message
    );
  }finally{
    refresh.disabled=false;
  }
}

refresh.addEventListener("click",loadNews);

/* 15分ごとに更新 */
setInterval(()=>{
  if(!document.hidden){
    loadNews();
  }
},15*60*1000);

/* 画面に戻った際にも更新 */
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden){
    loadNews();
  }
});

setHeight(DEFAULT);
loadNews();
</script>
</body>
</html>
